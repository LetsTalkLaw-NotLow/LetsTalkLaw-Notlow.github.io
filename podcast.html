@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e1c;--main:#12162b;--card:#1b2140;--ink:#eef0fa;--muted:#a2a8c6;--line:#2a3158;--lilac:#5d4a8c;--lilac2:#2c2552;--green:#1b3a2e;--greenink:#7fe0b0;--pill:#1b2140;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0e1c;--main:#12162b;--card:#1b2140;--ink:#eef0fa;--muted:#a2a8c6;--line:#2a3158;--lilac:#5d4a8c;--lilac2:#2c2552;--green:#1b3a2e;--greenink:#7fe0b0;--pill:#1b2140;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;padding:clamp(0px,2vw,24px)}
a{color:inherit}:focus-visible{outline:3px solid #8a6fd1;outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;height:100%;max-width:1280px;margin:0 auto;border-radius:28px;overflow:hidden;background:var(--main);box-shadow:0 10px 40px rgba(21,26,51,.12)}
.side{background:var(--side);color:#fff;padding:26px 18px;display:flex;flex-direction:column;gap:26px}
.brand{display:flex;gap:12px;align-items:center}.brand .av{width:48px;height:48px;border-radius:50%;flex:none}
.brand b{display:block;font-size:1.02rem;line-height:1.2;font-weight:800}.brand small{color:#aab1d4;font-size:.8rem}
nav{display:flex;flex-direction:column;gap:4px;flex:1}
nav a{display:flex;gap:14px;align-items:center;padding:11px 14px;border-radius:12px;text-decoration:none;color:#dfe3f6;font-weight:500}
nav a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav a:hover{background:rgba(255,255,255,.08)}nav a[aria-current="page"]{background:#fff;color:var(--side);font-weight:700}
.side .foot a{margin-top:auto}
.av,.ph{background:var(--photo) 50% 18%/cover no-repeat}
.main{overflow-y:auto;padding:22px clamp(16px,3vw,34px) 34px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:10px;background:var(--pill);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 8px}
.search i{width:34px;height:34px;border-radius:50%;background:var(--side);display:grid;place-items:center;flex:none}.search svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2}
.search input{all:unset;flex:1;min-width:0;color:var(--ink)}.search input::placeholder{color:var(--muted)}
.me{display:flex;gap:10px;align-items:center;text-align:right;line-height:1.25}.me .av{width:42px;height:42px;border-radius:50%}.me small{color:var(--muted)}
h1,h2{margin:0;font-weight:800;letter-spacing:-.02em}h2{font-size:1.45rem}
.view{display:none}.view.on{display:block}
.welcome{display:grid;grid-template-columns:200px 1fr;gap:26px;align-items:center;background:var(--card);border-radius:22px;padding:18px;margin-bottom:28px;border:1px solid var(--line)}
.welcome .ph{aspect-ratio:1;border-radius:18px}.welcome h1{font-size:clamp(1.6rem,3.2vw,2.3rem);margin-bottom:6px}.welcome p{margin:0 0 14px;color:var(--muted);max-width:52ch}
.btn{display:inline-block;background:var(--side);color:#fff;padding:10px 20px;border-radius:999px;font-weight:700;text-decoration:none;border:0;font:inherit;font-weight:700;cursor:pointer}
.btn.l{background:var(--lilac2);color:var(--ink)}.row{display:flex;gap:10px;flex-wrap:wrap}
.sec{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}.sec a{color:var(--muted);font-weight:600;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-bottom:30px}
.card{background:var(--card);border-radius:20px;padding:10px;border:1px solid var(--line)}
.thumb{height:130px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.9rem;margin-bottom:12px}
.t1{background:linear-gradient(135deg,#cdbbea,#f5d6e8)}.t2{background:linear-gradient(135deg,#9fb4e8,#d6e4ff)}.t3{background:linear-gradient(135deg,#f2c9a0,#fde7c8)}.t4{background:linear-gradient(135deg,#a8dcc4,#d9f2e6)}
.thumb span{background:rgba(26,34,64,.75);padding:4px 12px;border-radius:999px}
.card h3{margin:0 6px 8px;font-size:1.02rem}.meta{display:flex;justify-content:space-between;align-items:center;margin:0 6px 8px}
.meta .who{display:flex;gap:8px;align-items:center;font-size:.8rem;line-height:1.2}.meta .av{width:28px;height:28px;border-radius:50%}.who small{color:var(--muted)}
.tag{background:var(--green);color:var(--greenink);font-weight:700;font-size:.78rem;padding:5px 12px;border-radius:8px}
.card p{margin:0 6px 6px;color:var(--muted);font-size:.85rem}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.cont{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;gap:20px;align-items:center}
.cont .thumb{width:170px;height:130px;flex:none;margin:0}.bar{height:7px;background:var(--lilac2);border-radius:9px;margin:12px 0 6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--lilac)}
.sub{background:var(--lilac);color:#241a44;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.sub small{background:#fff;border-radius:999px;padding:3px 12px;align-self:flex-start;font-weight:600}.sub h2{font-size:2rem}
.sub .btn{align-self:flex-start;background:#151a33}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;margin-bottom:18px;max-width:880px}
.panel p{margin:0 0 12px;color:var(--muted)}.tags{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}.tags li{background:var(--lilac2);padding:7px 14px;border-radius:999px;font-weight:600;font-size:.88rem}
.tl{list-style:none;padding:0;margin:0;display:grid;gap:18px}.tl li{padding-left:18px;border-left:4px solid var(--lilac)}.tl time{color:var(--muted);font-weight:600;font-size:.85rem}.tl h3{margin:2px 0}.tl p{margin:4px 0 0}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:22px;color:var(--muted);text-align:center}
.cline{display:flex;flex-direction:column;gap:4px}
.player video{width:100%;border-radius:18px;background:#000;aspect-ratio:16/9;display:block}.player{max-width:900px}
.parts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.parts button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer}.parts button[aria-current="true"]{background:var(--side);color:#fff;border-color:var(--side)}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;max-width:900px}.lk{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;text-decoration:none}.lk:hover{border-color:var(--lilac)}.lk .ic{width:46px;height:46px;border-radius:14px;color:#fff;display:grid;place-items:center;font-weight:800;flex:none}.lk small{display:block;color:var(--muted)}
a.cont:hover{border-color:var(--lilac)}
@media (max-width:860px){body{padding:0}.app{grid-template-columns:1fr;grid-template-rows:auto 1fr;border-radius:0;height:100%}
.side{flex-direction:row;align-items:center;padding:10px 12px;gap:10px;overflow-x:auto}.brand small,.brand div{display:none}.brand .av{width:40px;height:40px}
nav{flex-direction:row;gap:2px}nav a span{display:none}nav a{padding:10px 12px}.side .foot{display:none}
.welcome{grid-template-columns:1fr}.welcome .ph{max-width:240px}.two{grid-template-columns:1fr}.cont{flex-direction:column;align-items:stretch}.cont .thumb{width:100%}.me div{display:none}}

.menu-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.side{position:fixed;top:0;left:0;bottom:0;z-index:100;width:min(290px,84vw);flex-direction:column;align-items:stretch;gap:26px;overflow-x:hidden;overflow-y:auto;border-radius:0 28px 28px 0;
 padding:calc(26px + env(safe-area-inset-top,0px)) 18px calc(26px + env(safe-area-inset-bottom,0px));
 transform:translateX(-105%);visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s;box-shadow:none}
.side.open{transform:none;visibility:visible;transition:transform .28s ease,visibility 0s;box-shadow:0 0 50px rgba(0,0,0,.45)}
.brand div,.brand small{display:block}.brand .av{width:48px;height:48px}
nav{flex-direction:column;gap:4px}nav a{padding:11px 14px}nav a span{display:inline}
.side .foot{display:block}
.scrim{display:block;position:fixed;inset:0;z-index:90;background:rgba(5,8,20,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
body.lock{overflow:hidden}
.grid{grid-template-columns:1fr}
}
@media (max-width:480px){.me{display:none}.cont .thumb{height:120px}}
@media (prefers-reduced-motion:reduce){.side,.scrim{transition:none}}
.yt{max-width:900px;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000}.yt iframe{width:100%;height:100%;border:0;display:block}

<script>
(function(){
const side=document.querySelector(".side"),top=document.querySelector(".top");
if(!side||!top)return;
const btn=document.createElement("button");btn.className="menu-btn";btn.type="button";
btn.setAttribute("aria-label","Open menu");btn.setAttribute("aria-expanded","false");
btn.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
top.insertBefore(btn,top.firstChild);
const scrim=document.createElement("div");scrim.className="scrim";document.body.appendChild(scrim);
function set(o){side.classList.toggle("open",o);scrim.classList.toggle("show",o);document.body.classList.toggle("lock",o);btn.setAttribute("aria-expanded",o);}
btn.addEventListener("click",()=>set(!side.classList.contains("open")));

side.addEventListener("click",e=>{if(e.target.closest("a"))set(false)});
